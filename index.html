<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Thư viện SGK Tiểu học</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e3e7ef;--pri:#2457d6;--pri2:#e8eefc;--ok:#0f9d58;
--g1:#e8590c;--g2:#d6336c;--g3:#7048e8;--g4:#1c7ed6;--g5:#0ca678}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.top h1{font-size:20px;margin:0;flex:1;min-width:200px}
.top h1 small{display:block;font-size:12px;color:var(--mute);font-weight:400}
#q{padding:9px 12px;border:1px solid var(--line);border-radius:10px;width:min(340px,100%);font-size:15px}
.tabs{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto}
.tab{border:0;background:var(--pri2);color:var(--pri);padding:9px 18px;border-radius:999px;font-weight:700;font-size:15px;white-space:nowrap}
.tab.on{background:var(--gc,var(--pri));color:#fff}
main{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.cover{aspect-ratio:3/4;background:#eef1f7 center/cover no-repeat;cursor:pointer;position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .last{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:3px 8px;border-radius:8px}
.card .meta{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card .t{font-weight:700;font-size:15px}
.card .s{font-size:12px;color:var(--mute)}
.vols{display:flex;gap:6px;flex-wrap:wrap}
.vol{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.vol:hover{border-color:var(--pri);color:var(--pri)}
.empty{color:var(--mute);padding:40px;text-align:center}
.res{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.res h3{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-size:15px}
.res a{display:flex;gap:10px;padding:8px 14px;color:inherit;text-decoration:none;border-bottom:1px solid #f1f3f7;font-size:14px}
.res a:hover{background:var(--pri2)}
.res a span{color:var(--mute);font-size:12px;margin-left:auto;white-space:nowrap}
mark{background:#ffe066;border-radius:3px}
/* Reader */
#reader{position:fixed;inset:0;background:#2b2f38;display:none;z-index:20;flex-direction:column}
#reader.on{display:flex}
.rbar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1f232b;color:#fff;flex-wrap:wrap}
.rbar .bt{background:#363c48;color:#fff;border:0;border-radius:8px;padding:7px 11px;font-size:14px}
.rbar .bt:hover{background:#4a5263}
.rbar .ttl{font-weight:700;flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar input{width:62px;padding:6px;border-radius:8px;border:0;text-align:center;font-size:14px}
.rbody{flex:1;display:flex;min-height:0}
#side{width:320px;background:#fff;display:flex;flex-direction:column;min-height:0}
#side.off{display:none}
.stabs{display:flex;border-bottom:1px solid var(--line)}
.stabs button{flex:1;border:0;background:#fff;padding:10px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent}
.stabs button.on{color:var(--pri);border-color:var(--pri)}
.slist{overflow:auto;flex:1}
.toc a{display:block;padding:9px 14px;border-bottom:1px solid #f1f3f7;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35}
.toc a:hover{background:var(--pri2)}
.toc a.sub{padding-left:30px;font-size:13px;color:#475467}
.toc a.cur{background:var(--pri2);color:var(--pri);font-weight:700;border-left:4px solid var(--pri);padding-left:10px}
.toc .none{padding:16px;color:var(--mute);font-size:14px;line-height:1.5}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.thumbs div{cursor:pointer;border:2px solid transparent;border-radius:6px;overflow:hidden;background:#eef1f7;font-size:11px;text-align:center;color:var(--mute)}
.thumbs div.cur{border-color:var(--pri)}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
#stage{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:14px;position:relative}
#pages{display:flex;gap:10px;align-items:flex-start}
#pages img{background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.4);display:block;max-width:none}
#spin{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);color:#ddd;font-size:14px;display:none}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:80px;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:28px;border-radius:10px;z-index:21}
.nav:hover{background:rgba(0,0,0,.6)}
#prev{left:calc(var(--sw,320px) + 8px)}#next{right:8px}
#reader.noside #prev{left:8px}
#cur{color:#cfd5e2;font-size:13px;white-space:nowrap}
@media (max-width:760px){#side{position:absolute;top:0;bottom:0;left:0;z-index:3;width:85%;box-shadow:4px 0 20px rgba(0,0,0,.4)}.rbody{position:relative}#prev{left:8px}.top h1{font-size:17px}}
</style>
</head>

i 5. Ôn tập chủ đề Gia đình"],[24,"Bài 6. Chào đón ngày khai giảng"],[28,"Bài 7. Ngày hội đọc sách của chúng em"],[32,"Bài 8. An toàn khi ở trường"],[36,"Bài 9. Giữ vệ sinh trường học"],[40,"Bài 10. Ôn tập chủ đề Trường học"],[42,"Bài 11. Hoạt động mua bán hàng hoá"],[46,"Bài 12. Thực hành mua bán hàng hoá"],[48,"Bài 13. Hoạt động giao thông"],[52,"Bài 14. Cùng tham gia giao thông"],[56,"Bài 15. Ôn tập chủ đề Cộng đồng địa phương"],[58,"Bài 16. Thực vật sống ở đâu?"],[62,"Bài 17. Động vật sống ở đâu?"],[66,"Bài 18. Cần làm gì để bảo vệ môi trường sống của thực vật và động vật?"],[72,"Bài 19. Thực vật và động vật quanh em"],[76,"Bài 20. Ôn tập chủ đề Thực vật và động vật"],[78,"Bài 21. Tìm hiểu cơ quan vận động"],[82,"Bài 22. Chăm sóc, bảo vệ cơ quan vận động"],[86,"Bài 23. Tìm hiểu cơ quan hô hấp"],[90,"Bài 24. Chăm sóc, bảo vệ cơ quan hô hấp"],[94,"Bài 25. Tìm hiểu cơ quan bài tiết nước tiểu"],[98,"Bài 26. Chăm sóc, bảo vệ cơ quan bài tiết nước tiểu"],[102,"Bài 27. Ôn tập chủ đề Con người và sức khoẻ"],[104,"Bài 28. Các mùa trong năm"],[108,"Bài 29. Một số thiên tai thường gặp"],[112,"Bài 30. Luyện tập ứng phó với thiên tai"],[116,"Bài 31. Ôn tập chủ đề Trái Đất và bầu trời"]]},"15":{"off":1,"items":[[5,"Bài 1. Vẻ đẹp quê hương em"],[9,"Bài 2. Em yêu quê hương"],[14,"Bài 3. Kính trọng thầy giáo, cô giáo"],[18,"Bài 4. Yêu quý bạn bè"],[23,"Bài 5. Quý trọng thời gian"],[29,"Bài 6. Nhận lỗi và sửa lỗi"],[33,"Bài 7. Bảo quản đồ dùng cá nhân"],[37,"Bài 8. Bảo quản đồ dùng gia đình"],[41,"Bài 9. Cảm xúc của em"],[45,"Bài 10. Kiềm chế cảm xúc tiêu cực"],[51,"Bài 11. Tìm kiếm sự hỗ trợ khi ở nhà"],[55,"Bài 12. Tìm kiếm sự hỗ trợ khi ở trường"],[59,"Bài 13. Tìm kiếm sự hỗ trợ ở nơi công cộng"],[62,"Bài 14. Tìm hiểu quy định nơi công cộng"],[66,"Bài 15. Em tuân thủ quy định nơi công cộng"]]},"16":{"off":1,"items":[[5,"Chủ đề 1. Sắc màu âm thanh"],[13,"Chủ đề 2. Em yêu làn điệu dân ca"],[19,"Chủ đề 3. Mái trường thân yêu"],[25,"Chủ đề 4. Tuổi thơ"],[30,"Ôn tập cuối học kì I"],[32,"Đánh giá cuối học kì I"],[33,"Chủ đề 5. Mùa xuân"],[41,"Chủ đề 6. Gia đình yêu thương"],[47,"Chủ đề 7. Những con vật quanh em"],[53,"Chủ đề 8. Mùa hè vui"],[58,"Ôn tập cuối năm"],[59,"Đánh giá cuối năm"]]}};
var GC={1:'var(--g1)',2:'var(--g2)',3:'var(--g3)',4:'var(--g4)',5:'var(--g5)'};
var KEY='sgk_online_v1';
var st={};try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
st.last=st.last||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

/* Sách */
var BOOKS=META.map(function(m,i){
  var b={i:i,grade:m[0],title:m[1],slug:m[2],pre:m[3],n0:m[4],count:m[5],ext:m[6]};
  b.subject=b.title.replace(/,\s*tập.*$/,'').replace(/\s*\d+$/,'');
  b.vol=/tập một/.test(b.title)?'Tập 1':/tập hai/.test(b.title)?'Tập 2':'Cả năm';
  b.toc=TOC[i]||null;
  return b;
});
function urls(b){
  if(b.u)return b.u;
  var p=DELTA[b.i].split(','),t=0,u=[];
  for(var k=0;k<p.length;k++){
    var s=p[k],neg=s[0]==='~';if(neg)s=s.slice(1);
    var v=parseInt(s,36);t=k===0?v:t+(neg?-v:v);
    u.push(BASE+b.pre+(b.n0+k)+'-'+t+'.'+b.ext);
  }
  return b.u=u;
}
function idxOfPage(b,p){return Math.max(0,Math.min(b.count-1,p+b.toc.off-b.n0));}

/* Thư viện */
var tabs=document.getElementById('tabs'),main=document.getElementById('main'),q=document.getElementById('q');
var grade=st.grade||1;
[1,2,3,4,5].forEach(function(g){
  var t=document.createElement('button');t.className='tab';t.textContent='Lớp '+g;t.dataset.g=g;t.style.setProperty('--gc',GC[g]);
  t.onclick=function(){grade=g;st.grade=g;save();q.value='';render();};tabs.appendChild(t);
});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){
  [].forEach.call(tabs.children,function(t){t.classList.toggle('on',+t.dataset.g===grade)});
  if(q.value.trim())return search(q.value.trim());
  var subs={},order=[];
  BOOKS.filter(function(b){return b.grade===grade}).forEach(function(b){
    if(!subs[b.subject]){subs[b.subject]=[];order.push(b.subject)}subs[b.subject].push(b);
  });
  var h='<div class="grid">';
  order.forEach(function(s){
    var bs=subs[s],b0=bs[0],u=urls(b0);
    var lastB=bs.filter(function(b){return st.last[b.i]!=null})[0];
    h+='<div class="card"><div class="cover" data-b="'+b0.i+'"><img loading="lazy" referrerpolicy="no-referrer" src="'+u[0]+'" alt="">'+
      (lastB?'<span class="last">Đang đọc: '+(bs.length>1?lastB.vol+', ':'')+'ảnh '+(st.last[lastB.i]+1)+'</span>':'')+'</div>'+
      '<div class="meta"><div class="t">'+esc(s)+' '+grade+'</div><div class="s">'+bs.map(function(b){return b.count+' trang'+(b.toc?' · có mục lục':'')}).join(' / ')+'</div><div class="vols">'+
      bs.map(function(b){return '<button class="vol" data-b="'+b.i+'">'+(b.vol==='Cả năm'?'📖 Mở sách':(b.vol==='Tập 1'?'📘 Tập 1 (HK1)':'📗 Tập 2 (HK2)'))+'</button>'}).join('')+
      '</div></div></div>';
  });
  main.innerHTML=h+'</div>';
}
main.addEventListener('click',function(e){
  var el=e.target.closest('[data-b]');if(!el)return;
  var b=BOOKS[+el.dataset.b];open(b,el.dataset.k!=null?+el.dataset.k:null);
});
function norm(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase()}
function hl(s,w){var n=norm(s),i=n.indexOf(w);if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+w.length))+'</mark>'+esc(s.slice(i+w.length))}
function search(w){
  var nw=norm(w),h='',tot=0;
  [1,2,3,4,5].forEach(function(g){
    BOOKS.filter(function(b){return b.grade===g}).forEach(function(b){
      var rows=[];
      if(norm(b.title).indexOf(nw)>=0)rows.push('<a href="#" data-b="'+b.i+'">📖 Mở sách '+hl(b.title,nw)+'</a>');
      if(b.toc)b.toc.items.forEach(function(it){
        if(norm(it[1]).indexOf(nw)>=0)rows.push('<a href="#" data-b="'+b.i+'" data-k="'+idxOfPage(b,it[0])+'">'+hl(it[1],nw)+'<span>trang '+it[0]+'</span></a>');
      });
      if(rows.length){tot+=rows.length;h+='<div class="res"><h3>Lớp '+g+' · '+esc(b.title)+'</h3>'+rows.join('')+'</div>';}
    });
  });
  main.innerHTML=tot?h:'<div class="empty">Không tìm thấy “'+esc(w)+'”.</div>';
}
q.addEventListener('input',render);
main.addEventListener('click',function(e){if(e.target.closest('a'))e.preventDefault()},true);

/* Đọc sách */
var R=document.getElementById('reader'),pages=document.getElementById('pages'),stage=document.getElementById('stage'),
    side=document.getElementById('side'),slist=document.getElementById('slist'),spin=document.getElementById('spin');
var cb=null,ck=0,zoom=st.zoom||0,two=!!st.two,stab='toc';
function open(b,k){
  cb=b;ck=k!=null?k:(st.last[b.i]||0);
  document.getElementById('rtitle').textContent='Lớp '+b.grade+' · '+b.title;
  document.getElementById('goto').max=b.count;
  stab=b.toc?'toc':'th';
  R.classList.add('on');document.body.style.overflow='hidden';
  if(innerWidth<760)side.classList.add('off');
  sideTabs();show();
}
function close(){R.classList.remove('on');document.body.style.overflow='';if(document.fullscreenElement)document.exitFullscreen();render();}
function curItem(){
  if(!cb.toc)return -1;var r=-1;
  cb.toc.items.forEach(function(it,j){if(idxOfPage(cb,it[0])<=ck)r=j});return r;
}
function show(){
  var u=urls(cb);ck=Math.max(0,Math.min(cb.count-1,ck));
  if(two&&ck>0&&ck%2===0)ck--; // ghép đôi: trang lẻ bên trái theo cặp (1),(2,3),(4,5)...
  var ks=two&&ck>0?[ck,ck+1].filter(function(k){return k<cb.count}):[ck];
  pages.innerHTML='';spin.style.display='block';var left=ks.length;
  var H=stage.clientHeight-28,W=(stage.clientWidth-28-(ks.length-1)*10)/ks.length;
  ks.forEach(function(k){
    var im=new Image();im.referrerPolicy='no-referrer';im.alt='Trang '+(k+1);
    im.onload=im.onerror=function(){if(--left<=0)spin.style.display='none';
      if(!im.naturalWidth){im.alt='Không tải được ảnh – kiểm tra mạng';im.style.cssText='width:300px;height:400px;color:#999'}
      size(im);};
    im.dataset.h=H;im.dataset.w=W;im.src=u[k];pages.appendChild(im);
  });
  st.last[cb.i]=ck;save();
  var p=cb.toc?(ck+cb.n0-cb.toc.off):null;
  document.getElementById('cur').textContent='Ảnh '+(ck+1)+'/'+cb.count+(p!=null&&p>0?' · trang '+p:'');
  document.getElementById('goto').value=ck+1;
  stage.scrollTop=0;
  if(cb.count>ck+2){var pre=new Image();pre.referrerPolicy='no-referrer';pre.src=u[ck+(two?2:1)]}
  markSide();
}
function size(im){
  if(!im.naturalWidth)return;
  var r=im.naturalWidth/im.naturalHeight,H=+im.dataset.h,W=+im.dataset.w;
  var fit=Math.min(W,H*r);var w=fit*Math.pow(1.2,zoom);im.style.width=Math.round(w)+'px';
}
function resize(){var H=stage.clientHeight-28,n=pages.children.length,W=(stage.clientWidth-28-(n-1)*10)/n;
  [].forEach.call(pages.children,function(im){im.dataset.h=H;im.dataset.w=W;size(im)});}
function sideTabs(){
  [].forEach.call(document.querySelectorAll('.stabs button'),function(x){x.classList.toggle('on',x.dataset.t===stab)});
  if(stab==='toc'){
    slist.className='slist toc';
    slist.innerHTML=cb.toc?cb.toc.items.map(function(it,j){return '<a href="#" data-j="'+j+'"'+(/^\s/.test(it[1])?' class="sub"':'')+'>'+esc(it[1].trim())+'</a>'}).join(''):
      '<div class="none">Sách này chưa có mục lục theo bài.<br>Dùng tab <b>Các trang</b> để chọn trang.</div>';
  }else{
    slist.className='slist';var u=urls(cb),h='<div class="thumbs">';
    for(var k=0;k<cb.count;k++)h+='<div data-k="'+k+'"><img loading="lazy" referrerpolicy="no-referrer" src="'+u[k]+'" alt="">'+(k+1)+'</div>';
    slist.innerHTML=h+'</div>';
  }
  markSide(true);
}
function markSide(scroll){
  var el=null;
  if(stab==='toc'){var j=curItem();[].forEach.call(slist.querySelectorAll('a'),function(a){var on=+a.dataset.j===j;a.classList.toggle('cur',on);if(on)el=a})}
  else [].forEach.call(slist.querySelectorAll('[data-k]'),function(d){var on=+d.dataset.k===ck;d.classList.toggle('cur',on);if(on)el=d});
  if(el&&(scroll||!vis(el)))el.scrollIntoView({block:'center'});
}
function vis(el){var a=el.getBoundingClientRect(),b=slist.getBoundingClientRect();return a.top>=b.top&&a.bottom<=b.bottom}
slist.addEventListener('click',function(e){
  e.preventDefault();var a=e.target.closest('[data-j],[data-k]');if(!a)return;
  if(a.dataset.j!=null)ck=idxOfPage(cb,cb.toc.items[+a.dataset.j][0]);else ck=+a.dataset.k;
  if(innerWidth<760)side.classList.add('off');show();
});
document.querySelector('.stabs').onclick=function(e){var t=e.target.dataset.t;if(t){stab=t;sideTabs()}};
function step(d){ck+=d*(two&&ck>0?2:1);if(two&&d<0&&ck<0)ck=0;show()}
document.getElementById('prev').onclick=function(){step(-1)};
document.getElementById('next').onclick=function(){step(1)};
document.getElementById('close').onclick=close;
document.getElementById('tside').onclick=function(){side.classList.toggle('off');R.classList.toggle('noside',side.classList.contains('off'));setTimeout(resize,0)};
document.getElementById('zin').onclick=function(){zoom=Math.min(zoom+1,8);st.zoom=zoom;save();resize()};
document.getElementById('zout').onclick=function(){zoom=Math.max(zoom-1,-4);st.zoom=zoom;save();resize()};
document.getElementById('zfit').onclick=function(){zoom=0;st.zoom=0;save();resize()};
var twoB=document.getElementById('two');function twoLbl(){twoB.textContent=two?'1 trang':'2 trang'}twoLbl();
twoB.onclick=function(){two=!two;st.two=two;save();twoLbl();show()};
document.getElementById('full').onclick=function(){if(document.fullscreenElement)document.exitFullscreen();else R.requestFullscreen&&R.requestFullscreen()};
document.getElementById('goto').onchange=function(){ck=(+this.value||1)-1;show()};
addEventListener('resize',function(){if(R.classList.contains('on'))resize()});
addEventListener('keydown',function(e){
  if(!R.classList.contains('on')||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='PageDown')step(1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')step(-1);
  else if(e.key==='Escape'&&!document.fullscreenElement)close();
  else if(e.key==='+'||e.key==='=')document.getElementById('zin').click();
  else if(e.key==='-')document.getElementById('zout').click();
  else if(e.key==='f'||e.key==='F')document.getElementById('full').click();
});
render();
</script>
